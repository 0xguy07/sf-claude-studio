name: Publish to npm

# Triggers on any tag matching v*  e.g.  v0.4.0, v1.0.0, v0.4.1-beta.1
# Workflow re-publishes whatever is in cli/ at the tagged commit.
# Tag versions MUST match cli/package.json's version field exactly,
# otherwise the publish step fails.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # required for npm provenance

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches cli/package.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./cli/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match cli/package.json version ${pkg}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package version ${pkg}"

      - name: Install CLI deps
        working-directory: cli
        run: npm ci || npm install --no-audit --no-fund

      - name: Build bundled templates
        working-directory: cli
        run: npm run build:templates

      - name: Verify package contents (dry run)
        working-directory: cli
        run: npm publish --dry-run --provenance --access public

      - name: Publish to npm
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Annotate run
        run: |
          echo "## Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tag:  \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- npm:  https://www.npmjs.com/package/sf-claude-studio" >> $GITHUB_STEP_SUMMARY
